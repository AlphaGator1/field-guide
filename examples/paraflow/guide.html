<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Guide</title>
<style>
/* A neutral page: a masthead band, then a two-pane guide (system tiles by group on the
   left, the selected system's dossier pinned on the right, stacked on phones), then the
   jobs table and the glossary. System fonts only: the page makes no network request. */
:root {
  --bg: #fbfbfa; --surface: #f1f1ef; --raised: #ffffff; --fg: #1c1c1a; --muted: #62625d;
  --border: #e2e1dc; --accent: #2b59c3; --accent-soft: color-mix(in oklab, #2b59c3 9%, transparent);
  --warn: #9a5b00; --warn-soft: color-mix(in oklab, #b26a00 10%, transparent);
  --mast: #1f2328; --on-mast: #f3f3f1; --on-mast-muted: #a9adb3; --mast-input: #2b3036; --mast-border: #3d434a;
  --g0: #2b59c3; --g1: #a3511f; --g2: #2f7d4f; --g3: #8a3fa8; --g4: #a8326a; --g5: #1f7f8c; --g6: #7a6a12; --g7: #5d6470;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --surface: #1c1c1c; --raised: #232323; --fg: #ecebe8; --muted: #a3a29c;
    --border: #34332f; --accent: #7aa2ff; --accent-soft: color-mix(in oklab, #7aa2ff 16%, transparent);
    --warn: #f2b84b; --warn-soft: color-mix(in oklab, #f2b84b 12%, transparent);
    --mast: #0d0d0d; --mast-input: #1d1d1d; --mast-border: #34332f;
    --g0: #7aa2ff; --g1: #f0a06e; --g2: #6fcf97; --g3: #c99bf0; --g4: #f28cb8; --g5: #6fd0dc; --g6: #e0cd6a; --g7: #a5acb8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --surface: #1c1c1c; --raised: #232323; --fg: #ecebe8; --muted: #a3a29c;
  --border: #34332f; --accent: #7aa2ff; --accent-soft: color-mix(in oklab, #7aa2ff 16%, transparent);
  --warn: #f2b84b; --warn-soft: color-mix(in oklab, #f2b84b 12%, transparent);
  --mast: #0d0d0d; --mast-input: #1d1d1d; --mast-border: #34332f;
  --g0: #7aa2ff; --g1: #f0a06e; --g2: #6fcf97; --g3: #c99bf0; --g4: #f28cb8; --g5: #6fd0dc; --g6: #e0cd6a; --g7: #a5acb8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
code, .mono { font-family: var(--font-mono); font-size: 0.86em; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.mast { background: var(--mast); color: var(--on-mast); }
.mast .wrap { padding-block: 28px 22px; display: grid; gap: 16px; }
.eyebrow { font-size: 0.85rem; color: var(--on-mast-muted); letter-spacing: 0.02em; }
.mast h1 { font-size: clamp(1.8rem, 3.4vw, 2.5rem); font-weight: 700; letter-spacing: -0.01em; line-height: 1.12; }
.mast p { margin: 0; max-width: 72ch; color: var(--on-mast-muted); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; font-variant-numeric: tabular-nums; }
.stat b { display: block; font-size: 1.3rem; font-weight: 600; color: var(--on-mast); }
.stat span { font-size: 0.82rem; color: var(--on-mast-muted); }
.searchbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.searchbar input { flex: 1 1 320px; min-width: 0; background: var(--mast-input); color: var(--on-mast); border: 1px solid var(--mast-border); border-radius: 8px; padding: 10px 14px; font: inherit; }
.searchbar input::placeholder { color: var(--on-mast-muted); }
.searchbar .hint { font-size: 0.82rem; color: var(--on-mast-muted); }

.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 470px); gap: 28px; padding-block: 26px 10px; align-items: start; }
@media (max-width: 1000px) { .panes { grid-template-columns: minmax(0, 1fr); } }
.lane { display: grid; gap: 10px; margin-bottom: 22px; }
.lane-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.lane-head h2 { font-size: 1.02rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.lane-head h2::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--lane); flex: none; }
.lane-head p { margin: 0; font-size: 0.86rem; color: var(--muted); min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 13px 11px; cursor: pointer; display: grid; gap: 4px; align-content: start; border-top: 3px solid var(--lane); transition: border-color .15s, background .15s, opacity .15s; min-width: 0; }
.tile:hover { border-color: var(--accent); border-top-color: var(--lane); }
.tile .t-name { font-weight: 600; font-size: 0.97rem; }
.tile .t-line { font-size: 0.84rem; color: var(--muted); line-height: 1.4; }
.tile .t-meta { font-size: 0.76rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }
.tile[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); border-top-color: var(--lane); }
.tile.linked { border-color: var(--lane); }
.tile .t-link { display: none; font-size: 0.76rem; color: var(--fg); line-height: 1.35; padding-top: 4px; border-top: 1px dashed var(--border); margin-top: 4px; }
.tile.linked .t-link { display: block; }
.tile.dim { opacity: 0.32; }

.dossier { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; background: var(--surface); border-radius: 14px; padding: 20px 20px 22px; display: grid; gap: 18px; min-width: 0; }
@media (max-width: 1000px) { .dossier { position: static; max-height: none; } }
.d-eyebrow { font-size: 0.8rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.d-eyebrow::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--lane); }
.dossier h2 { font-size: 1.42rem; font-weight: 700; line-height: 1.2; }
.d-line { margin: 4px 0 0; color: var(--muted); }
.d-summary { margin: 0; max-width: 65ch; }
.sec { display: grid; gap: 8px; }
.sec h3 { font-size: 0.86rem; font-weight: 600; color: var(--muted); letter-spacing: 0.01em; }
ol.journey { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
ol.journey li::marker { color: var(--muted); font-variant-numeric: tabular-nums; }
.files { display: grid; gap: 7px; }
.file { display: grid; gap: 1px; min-width: 0; }
.file code { color: var(--fg); overflow-wrap: anywhere; }
.file span, .switch span { font-size: 0.86rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 0.78rem; background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; overflow-wrap: anywhere; }
.links { display: grid; gap: 6px; }
.linkrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.linkrow b { color: var(--accent); font-weight: 600; white-space: nowrap; }
.linkrow span { font-size: 0.88rem; color: var(--muted); }
.linkrow:hover b { text-decoration: underline; }
.jobs-mini { display: grid; gap: 8px; }
.job, .switch { display: grid; gap: 1px; }
.job .when { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.watch { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.watch li { background: var(--warn-soft); border-left: 3px solid var(--warn); padding: 8px 11px; border-radius: 0 8px 8px 0; font-size: 0.92rem; }
.flows { display: grid; gap: 20px; }
.flows h3 { font-size: 1rem; color: var(--fg); margin-bottom: 8px; }
.flow { margin: 0; padding: 0; list-style: none; display: grid; counter-reset: step; }
.flow li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding-bottom: 12px; position: relative; counter-increment: step; }
.flow li::before { content: counter(step); width: 24px; height: 24px; border-radius: 50%; background: var(--raised); border: 1px solid var(--border); display: grid; place-items: center; font-size: 0.78rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.flow li:not(:last-child)::after { content: ""; position: absolute; left: 12px; top: 26px; bottom: 2px; width: 1px; background: var(--border); }
.flow button { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-align: left; }
.flow p { margin: 1px 0 0; font-size: 0.9rem; }
.empty-note { font-size: 0.9rem; color: var(--muted); margin: 0; }

.lower { padding-block: 18px 40px; display: grid; gap: 34px; }
/* Grid children default to min-width: auto, which lets the wide jobs table stretch the page
   instead of scrolling inside .tablewrap. */
.lower > * { min-width: 0; }
.lower h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
.lower .sub { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; max-width: 70ch; }
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 0.9rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 0.82rem; background: var(--surface); }
tr:last-child td { border-bottom: 0; }
td.when { white-space: nowrap; font-variant-numeric: tabular-nums; }
.kind { font-size: 0.75rem; border-radius: 5px; padding: 1px 6px; white-space: nowrap; border: 1px solid var(--border); color: var(--muted); }
td .sysbtn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); font-weight: 500; text-align: left; }
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px 28px; margin: 0; }
.gloss div { min-width: 0; }
.gloss dt { font-weight: 600; }
.gloss dd { margin: 2px 0 0; color: var(--muted); font-size: 0.92rem; }
.foot { font-size: 0.82rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: 14px; }
.foot p { margin: 0 0 4px; max-width: 86ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="eyebrow">Field Guide · how this project is built</div>
    <h1 id="title">Field Guide</h1>
    <p id="about"></p>
    <div class="stats" id="stats"></div>
    <div class="searchbar">
      <label for="q" class="sr-only">Search the guide</label>
      <input id="q" type="search" placeholder="Search a system, file path, job, switch or term" autocomplete="off">
      <span class="hint" id="qstatus" aria-live="polite">Pick a system to see how it works.</span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="panes">
    <div id="map"></div>
    <aside class="dossier" id="dossier" aria-live="polite"></aside>
  </div>
  <div class="lower">
    <section id="jobs-sec">
      <h2>Everything that runs on a schedule or on demand</h2>
      <p class="sub">Each job, the system that owns it, and what starts it.</p>
      <div class="tablewrap"><table id="jobs"></table></div>
    </section>
    <section id="gloss-sec">
      <h2>Glossary</h2>
      <p class="sub">The terms the entries use, in plain English.</p>
      <dl class="gloss" id="gloss"></dl>
    </section>
    <footer class="foot" id="foot"></footer>
  </div>
</main>

<script type="application/json" id="guide-data">{"title":"ParaFlow Field Guide","groups":[{"id":"dictation","name":"The dictation path","blurb":"From the key press to text at the cursor."},{"id":"models","name":"Local speech and cleanup models","blurb":"The GPU model servers that turn audio into tidy text."},{"id":"app","name":"App shell and windows","blurb":"The tray app, its windows and its settings."},{"id":"ship","name":"Build, release and docs","blurb":"How ParaFlow is built, packaged and explained."}],"systems":[{"id":"hotkey","group":"dictation","name":"Push-to-talk hotkey","oneLiner":"Detects the push-to-talk chord being pressed, released, or double-tapped anywhere in Windows.","summary":"A low-level keyboard hook (WH_KEYBOARD_LL, a Windows callback that sees every keystroke system-wide) running on its own thread with a message pump, the loop without which Windows never calls the hook. It watches for the configured chord, Ctrl+Win by default, and sends the pipeline Down when every key is held, Up when one is released, and ToggleLatch on a quick double press or on any press of the chord while hands-free recording is on. It exists because RegisterHotKey, which Tauri's global-shortcut plugin wraps, only reports presses, and push-to-talk needs the release too. It also reads a new chord for the settings screen and stops the Start menu opening when a Win-key chord is released.","journey":["Once the speech models have loaded, the app installs the hook on a dedicated thread with the saved chord and latch setting.","A user holds Ctrl+Win; when the last key of the chord goes down, the hook sends Down to the pipeline.","If Win is in the chord, the hook injects a do-nothing key (0xFC) so releasing Win does not open the Start menu.","The user lets go of any chord key; the hook sends Up and remembers when it happened.","If the handsFree setting is on, pressing the chord again within the double-press window (Windows' double-click time, read once when the hook starts and clamped to 200-600 ms) sends ToggleLatch instead, starting hands-free recording.","While hands-free is on, any press of the chord sends ToggleLatch to stop, and its release does not arm a new double press.","In Settings, the Change button reads the new chord from the window's own key events, because the hook sees no keys while that window has focus; hook capture is armed too and swallows every key it does see.","The largest set held at once fills the hotkey field; it becomes the chord only when the user clicks Save settings, which pushes it into the hook."],"owns":["src-tauri/src/hotkey.rs"],"keyFiles":[{"path":"src-tauri/src/hotkey.rs","what":"The hook itself: chord matching, double-press latch detection, chord capture, and the Start-menu workaround."},{"path":"src-tauri/src/lib.rs","what":"start_pipeline spawns the hook thread after models load; save_settings and capture commands push changes into it."},{"path":"src-tauri/src/settings.rs","what":"Stores the chord as key names; chord() parses them and falls back to Ctrl+Win if unusable."},{"path":"src/Settings.tsx","what":"Rebind screen: reads DOM key events, as the hook sees nothing while it has focus; arms hook capture too."}],"models":[],"jobs":[],"switches":[{"name":"hotkey","what":"Settings key naming the chord's keys; unrecognised names fall back to the default chord rather than an unpressable one."},{"name":"handsFree","what":"Settings key that arms or disarms double-tap hands-free latching; pushed into the hook without a restart."},{"name":"PARAFLOW_NO_LATCH","what":"When set, turns double-tap latching off regardless of the settings file."}],"connects":[{"to":"pipeline","why":"Sends Down, Up and ToggleLatch over a channel; the pipeline tells the hook when hands-free starts and ends."},{"to":"settings","why":"Chord names parse through hotkey's Chord; save_settings pushes chord and latch changes into the running hook."},{"to":"app-shell","why":"lib.rs spawns the hook thread and relays capture previews and the captured chord to the settings window."},{"to":"injection","why":"The hook skips injected keystrokes, so injection's synthetic Ctrl+V cannot re-engage the chord."}],"rules":["README.md"],"checks":["src-tauri/src/hotkey.rs"],"watchOuts":["Never do slow work, or hold the state lock while logging, inside hook_proc, because Windows silently uninstalls a low-level hook that exceeds its timeout and push-to-talk simply stops.","Never remove the LLKHF_INJECTED filter, because injection's synthetic Ctrl down comes back through the hook and, with Win still held, re-engages the chord and starts recording mid-paste.","Never swallow the Win key-up to stop the Start menu, because every other app then believes Win is still held; the hook injects a no-op key instead.","Always keep the side-specific key codes in canonical() correct and tested, because a transposed VK_LCONTROL once made Ctrl+Win impossible to press with no error.","Always cancel capture when leaving the rebind screen, because while capture is armed the hook swallows every keystroke system-wide."]},{"id":"audio","group":"dictation","name":"Microphone and chimes","oneLiner":"Opens the microphone on demand, buffers audio with pre-roll, and plays session chimes.","summary":"audio.rs wraps the default Windows input device, through the cpal audio library, in a MicSession that opens on the first press of a dictation burst and is closed by the pipeline after an idle timeout, so the OS microphone light honestly means ParaFlow is listening. While it is open, every sample is mixed to mono and written into a 150-second ring buffer (a fixed-size store that overwrites its oldest audio); starting a recording just notes a position in it, reaching back 300 ms as pre-roll on every press except a burst's first. When the recording ends, that slice is resampled to 16 kHz with an FFT resampler and encoded as a 16-bit WAV for the transcription server. sound.rs synthesises two short chimes in memory, rising when the mic goes live and falling when it closes.","journey":["A user presses the hotkey for the first time in a while; the default input device opens, the one delay of a burst.","A rising two-tone chime (2 x 70 ms) says it is safe to speak; recording starts after it so the beep stays out of the transcript.","While the mic is open, every captured frame is averaged to mono and pushed into the ring buffer.","Later presses in the same burst start instantly, marking a point 300 ms back as pre-roll.","While recording, a level probe reports the peak of the last ~50 ms for the overlay's meter.","On release, the audio since the mark is copied out, resampled to 16 kHz and wrapped as a WAV.","After the idle timeout the device is released, the OS capture light goes out and a falling chime plays."],"owns":["src-tauri/src/audio.rs","src-tauri/src/sound.rs"],"keyFiles":[{"path":"src-tauri/src/audio.rs","what":"MicSession: on-demand capture, ring buffer and marks, level probe, resampling to 16 kHz, WAV encoding."},{"path":"src-tauri/src/sound.rs","what":"Synthesises and plays the rising ready chime and falling closed chime; obeys the chimes setting."},{"path":"src-tauri/src/pipeline.rs","what":"Decides when the mic opens, is marked, read and closed; waits out the ready chime before marking."},{"path":"src-tauri/src/lib.rs","what":"Creates the MicSession on the pipeline thread, because cpal streams cannot move between threads."}],"models":[],"jobs":[],"switches":[{"name":"chimes","what":"Settings key that turns the rising and falling session chimes on or off; read on every chime. Off still keeps the 140 ms pause before a burst's first recording."}],"connects":[{"to":"pipeline","why":"The pipeline opens, marks, reads and closes the MicSession and plays chimes at session start and end."},{"to":"transcription","why":"Produces the 16 kHz mono 16-bit WAV the ASR sidecar transcribes, including its startup warm-up clip."},{"to":"settings","why":"Reads the chimes flag each time a chime would play, so switching it off applies immediately."}],"rules":["README.md"],"checks":["src-tauri/src/audio.rs","src-tauri/src/pipeline.rs"],"watchOuts":["Never let pipeline::MAX_LATCHED reach RING_SECONDS, because Ring::slice silently clamps to resident audio and a long hands-free recording would lose its beginning; a pipeline test requires at least 10 s of headroom (the ceiling is 120 s in a 150 s ring).","Always keep MicSession on the thread that opened it, because cpal's Stream is not Send on Windows; hand other threads a LevelProbe instead.","Never replace the FFT resampler with plain decimation or drop its delay-and-flush handling, because aliasing costs accuracy and a missed flush clips the final consonant; tests pin exact output lengths and the tail.","Always mark with mark_now after the ready chime on a burst's first press, because the chime is already in the ring and pre-roll would feed the beep to the recogniser.","Always time the resampler in a release build, because a debug build makes it look like the slowest stage when it is a tiny share of the pipeline."]},{"id":"pipeline","group":"dictation","name":"Dictation pipeline","oneLiner":"Turns each hotkey press into recorded, transcribed, cleaned-up text pasted at the cursor.","summary":"pipeline.rs is the state machine at the centre of dictation, running on its own thread and fed push-to-talk events by the hotkey thread over a channel, so slow transcription can never block the keyboard hook. It manages two nested lifetimes: a session, which opens the microphone on the first press of a burst and closes it after an idle timeout, and an utterance, one press-and-hold or one hands-free recording inside it. When an utterance ends it discards taps and silence, sends the audio for transcription, asks the cleanup model to polish it in a style matched to the focused app, and pastes the result. Each step is reported to the HUD as Tauri events: flow://stage, flow://mic and flow://level.","journey":["While models load the HUD shows Starting; then the pipeline reports Idle with the microphone closed.","A user presses the hotkey: the mic opens if needed (Waking, then a chime) and the stage becomes Listening, with a level sent every 50 ms.","The user releases the key; anything held under 250 ms is ignored as a mis-press.","Audio below the noise floor, or an empty transcript, is dropped without pasting.","Otherwise the audio is transcribed, the focused app is identified, and cleanup runs in that app's style, or the raw text is kept.","The text is pasted at the cursor and the HUD shows Done with the text and the time since recording began.","A double-tap instead starts hands-free recording; a single press stops it, and it stops itself at 120 s.","After the idle timeout (30 s by default) with no presses, the mic closes and a falling chime plays."],"owns":["src-tauri/src/pipeline.rs"],"keyFiles":[{"path":"src-tauri/src/pipeline.rs","what":"The session and utterance state machine, Stage events, the hands-free ceiling, and the tap and silence filters."},{"path":"src-tauri/src/lib.rs","what":"start_pipeline starts the ASR and cleanup sidecars, spawns the hotkey thread, then runs the pipeline loop."},{"path":"src-tauri/src/hotkey.rs","what":"Source of the Down, Up and ToggleLatch events the pipeline consumes."},{"path":"src-tauri/src/audio.rs","what":"The MicSession the pipeline opens, marks, reads from and closes."},{"path":"src-tauri/src/settings.rs","what":"Live settings read per use: the idle timeout, with its PARAFLOW_IDLE_SECS override, on every idle sweep."},{"path":"src/App.tsx","what":"The overlay that renders the stage, mic and level events the pipeline emits."}],"models":[],"jobs":[],"switches":[{"name":"idleSeconds","what":"Settings key for how long the mic stays open after the last dictation; read on every sweep, so changes apply live."},{"name":"PARAFLOW_IDLE_SECS","what":"Overrides the idle timeout from the settings file; the result is clamped to 5-3600 s."}],"connects":[{"to":"hotkey","why":"Receives Down, Up and ToggleLatch; tells the hook when hands-free recording starts and stops."},{"to":"audio","why":"Opens, marks and closes the mic session, takes 16 kHz samples as WAV, and plays session chimes."},{"to":"transcription","why":"Sends each utterance's WAV to the ASR sidecar and receives the raw transcript."},{"to":"cleanup","why":"Passes the raw transcript and the focused app's Style; gets polished text, or the raw text on failure."},{"to":"injection","why":"Asks which process has focus before cleanup, then hands the final text over to be pasted."},{"to":"hud","why":"Emits flow://stage, flow://mic and flow://level events that drive the overlay."}],"rules":["README.md"],"checks":["src-tauri/src/pipeline.rs"],"watchOuts":["Always clear the hook's latched flag before transcribing, not after, because while it is set the hook turns every chord press into a latch toggle, so a press made during transcription would start an unwanted hands-free recording.","Never let MAX_LATCHED grow toward audio::RING_SECONDS, because the ring clamps silently and a long hands-free recording would lose its first sentence; a unit test requires at least 10 s of headroom (120 s against 150 s).","Always read the focused app before cleanup, because cleanup takes long enough for the user to switch windows and get text styled for the wrong app.","Always remember this loop is single-threaded and events carry no timestamp, because a press and release made while a previous utterance is still processing are read together and discarded as a too-short tap.","Never compute the latch countdown with plain Duration subtraction, because Duration subtraction panics on underflow and would kill the pipeline thread; latched_stage saturates at zero and a test pins it past the ceiling."]},{"id":"injection","group":"dictation","name":"Text injection","oneLiner":"Pastes the finished text into whatever app has focus, then restores the clipboard.","summary":"inject.rs gets dictated text into the focused app by borrowing the Windows clipboard: it saves the current clipboard text, puts the transcript there, sends Ctrl+V with SendInput (the Windows call that fakes keystrokes), waits 120 ms, then puts the old text back if the clipboard still holds the transcript. Clipboard paste was chosen over typing character by character, which drops characters in throttled apps, upsets IME (input method) state and is slow for long passages. Before pasting it releases any modifier key still physically held, so Ctrl+V does not arrive as Win+Ctrl+V. It also reports the focused window's process name, which the pipeline uses to pick a cleanup style.","journey":["Just before cleanup, the pipeline asks which executable owns the focused window, such as code or outlook.","With the final text ready, any of Ctrl, Shift, Alt or Win still held down gets a synthetic key-up.","The current clipboard text is saved and replaced with the transcript; opening the clipboard is tried up to 10 times, waiting 10 to 100 ms between tries, if another app holds it.","Ctrl+V is sent to the focused app.","After 120 ms, if the clipboard still holds the transcript, the previous text is put back; if the user copied something meanwhile, it is left alone."],"owns":["src-tauri/src/inject.rs"],"keyFiles":[{"path":"src-tauri/src/inject.rs","what":"Clipboard save, set and restore; modifier release; synthetic Ctrl+V; focused window title and process name."},{"path":"src-tauri/src/pipeline.rs","what":"Calls foreground_process before cleanup and paste after it."},{"path":"src-tauri/src/polish.rs","what":"Style::for_process maps the process name to the Code, Chat, Mail or Prose cleanup style."},{"path":"src-tauri/src/hotkey.rs","what":"Ignores injected keystrokes, so the synthetic Ctrl+V cannot restart recording."}],"models":[],"jobs":[],"switches":[],"connects":[{"to":"pipeline","why":"Receives the final text to paste; supplies the focused process name and window title."},{"to":"cleanup","why":"Its process name feeds Style::for_process, which picks the cleanup tone for each app."},{"to":"hotkey","why":"Its synthetic keystrokes are flagged as injected, which the hook skips so pasting never re-engages the chord."}],"rules":["README.md"],"checks":[],"watchOuts":["Never release modifiers unconditionally before pasting, because a lone Alt key-up activates the menu bar (Notepad's KeyTips) and eats the Ctrl+V; only keys GetAsyncKeyState reports down are released.","Never restore the clipboard blindly after the settle, because the user may have copied something in those 120 ms; restore only while it still holds the transcript.","Never drive behaviour from the window title, because titles change with the open document, get localised and collide across apps; use the process name.","Never let a ParaFlow window take focus during dictation, because the paste lands in whatever is focused; the HUD opens without focus and lets clicks pass through for this reason.","Always remember only plain text is saved, because an image or file list on the clipboard is replaced by the transcript and never restored, and formatting copied with text (HTML, RTF) is lost."]},{"id":"transcription","group":"models","name":"Transcription","oneLiner":"Turns each recorded utterance into text using a speech model running on your GPU.","summary":"Transcription turns a recorded utterance into text on the local GPU. The speech-recognition model runs in a separate local HTTP server (a 'sidecar') that keeps the model loaded in GPU memory, so each dictation costs one quick request instead of a model load. Two backends share the same client code: NVIDIA Parakeet via parakeet.cpp (the default, which adds punctuation and capitals itself) and OpenAI Whisper via whisper.cpp (opt-in with PARAFLOW_ASR=whisper, kept as a fallback because one benchmark sample is not an accuracy test; ParaFlow does not use its prompt biasing). The client posts a WAV file, reads the text back, and drops silence markers such as [BLANK_AUDIO].","journey":["At launch ParaFlow picks a backend from PARAFLOW_ASR (Parakeet unless set to whisper) and finds its server binary, CUDA build first.","It starts the speech server on 127.0.0.1 port 8178 and waits up to 180 s for the model to load; if the server cannot start, dictation never starts and the overlay shows the error.","It pushes one second of faint noise through the model, so GPU warm-up costs are paid before the user speaks.","A user releases the hotkey; the pipeline hands over the recording as a 16 kHz mono WAV.","Asr posts the WAV as a multipart form and reads the `text` field of the JSON reply.","Lines that are only non-speech markers, like [BLANK_AUDIO] or (wind blowing), are dropped and the rest joined into one transcript.","The pipeline passes the transcript to cleanup, or pastes it directly when cleanup is off."],"owns":["src-tauri/src/asr.rs","scripts/test-asr.ps1","scripts/test-parakeet.ps1"],"keyFiles":[{"path":"src-tauri/src/asr.rs","what":"Backend choice, server launch flags, warm-up, the transcribe() HTTP client and silence-marker stripping."},{"path":"src-tauri/src/lib.rs","what":"start_pipeline reads PARAFLOW_ASR and PARAFLOW_MODEL, resolves the server binary and model, then starts Asr."},{"path":"src-tauri/src/sidecar.rs","what":"Shared port check, job-object tie and readiness probe used when starting the speech server."},{"path":"scripts/test-asr.ps1","what":"Pins whisper-server's flags, multipart field name and JSON shape; reports cold and warm latency."},{"path":"scripts/test-parakeet.ps1","what":"Benchmarks parakeet-server on CUDA or Vulkan with the same method, so the numbers compare directly."}],"models":[],"jobs":[],"switches":[{"name":"PARAFLOW_ASR","what":"Selects the transcription backend: Parakeet unless set to whisper; an unknown value falls back to Parakeet with a warning."},{"name":"PARAFLOW_MODEL","what":"Overrides which model file in models/ the chosen backend loads, instead of that backend's default."}],"connects":[{"to":"model-servers","why":"Uses its port check, job-object tie and readiness probe to start parakeet-server or whisper-server."},{"to":"audio","why":"Receives utterances as 16 kHz mono WAV bytes from audio's encoder; warm-up uses it too."},{"to":"pipeline","why":"The pipeline calls transcribe() once per utterance and receives the raw transcript text."},{"to":"app-shell","why":"lib.rs picks the backend, resolves binary and model paths, and starts Asr at launch."},{"to":"first-run-setup","why":"Setup downloads the Parakeet runtime and model loaded here; whisper comes only from scripts/setup.ps1."}],"rules":["README.md"],"checks":["scripts/test-asr.ps1","scripts/test-parakeet.ps1","src-tauri/src/asr.rs"],"watchOuts":["Always run scripts/test-asr.ps1 (whisper) or scripts/test-parakeet.ps1 (Parakeet) after bumping an upstream runtime, because asr.rs depends on CLI flags, the multipart field name `file` and a JSON `text` field that no Rust type checks; test-parakeet.ps1 prints the raw reply rather than failing when `text` is missing, so read its transcript line.","Never remove the startup warm-up in Asr::start, because the first inference pays a one-off GPU compile (a driver JIT compile on RTX 50-series cards, over a second on a fresh machine; the Vulkan build's shader compile on its first-ever run) that would otherwise land on the user's first dictation.","Always re-check after a whisper.cpp upgrade that the CUDA build still ships sm_90 PTX, because RTX 50-series (sm_120) cards run it only by JIT-compiling that PTX; arch-specific binaries alone would break them.","Never paste recogniser output without clean(), because recognisers emit bracketed markers like [BLANK_AUDIO] for silence and those would be typed into the user's document.","Never expect PARAFLOW_ASR=whisper to work on an installed copy, because first-run setup downloads only Parakeet; whisper's binaries and model come only from scripts/setup.ps1."]},{"id":"cleanup","group":"models","name":"Cleanup and dictionary","oneLiner":"Rewrites raw transcripts into clean text, styled for the target app, never losing words.","summary":"Cleanup rewrites a raw transcript into clean written text using a small local instruction model (a language model tuned to follow written instructions), Qwen3 4B, served by llama-server. It removes fillers, applies spoken self-corrections, formats dictated lists, matches the register of the app being typed into, and corrects names to the spellings in the user's personal dictionary. Its first rule is to write the user's words down and never answer them; its second is to fail open: any error, timeout, truncation, or reply that looks like an answer returns the raw transcript unchanged. A quality harness in src-tauri/examples/cleanup.rs, run by hand, sends adversarial cases through the real prompt and prints the results for a person to judge; it asserts nothing.","journey":["At launch, if cleanup is enabled, ParaFlow finds llama-server (CUDA build first, then Vulkan) and the Qwen3 4B model; if either is missing, or the server fails to start, it carries on with raw transcripts.","It reads %LOCALAPPDATA%\\ParaFlow\\dictionary.txt once, creating a commented template if absent, and appends its terms to the system prompt; edits apply only after a restart.","It starts llama-server on 127.0.0.1 port 8179 and sends one warm-up request to fill the prompt cache.","After a dictation is transcribed, the pipeline reads which app has focus; its process name picks a style: Code, Chat, Mail or Prose.","Polish sends the system prompt, six few-shot examples, and the transcript fenced in \u003ctranscript> tags with a \u003cstyle> tag.","Guards check the reply: truncated, empty, far longer than the input, or sharing under half its words means the raw transcript is kept.","The cleaned (or raw) text goes back to the pipeline to be pasted."],"owns":["src-tauri/src/polish.rs","src-tauri/src/dictionary.rs","src-tauri/examples/**"],"keyFiles":[{"path":"src-tauri/src/polish.rs","what":"llama-server launch, system prompt, few-shot examples, per-app styles, request budgets and the fail-open guards."},{"path":"src-tauri/src/dictionary.rs","what":"Reads dictionary.txt, writes its template, de-duplicates terms, and builds the system-prompt line."},{"path":"src-tauri/examples/cleanup.rs","what":"Quality harness: 15 cases, some adversarial, run through the real prompt with timings."},{"path":"src-tauri/src/lib.rs","what":"start_polish decides whether cleanup runs and finds llama-server, the model and the dictionary."},{"path":"src-tauri/src/pipeline.rs","what":"handle_utterance picks the style from the focused app, then calls Polish::apply."}],"models":[],"jobs":[],"switches":[{"name":"PARAFLOW_NO_CLEANUP","what":"When set to anything, turns the cleanup pass off and pastes raw transcripts, overriding the settings file."},{"name":"PARAFLOW_CLEANUP_MODEL","what":"Overrides which model file in models/ llama-server loads for cleanup."},{"name":"cleanup","what":"settings.json key that turns the cleanup pass on or off; a change applies only after restarting ParaFlow."},{"name":"PARAFLOW_ACCEL","what":"Harness only: chooses which repo llama-server build (vendor/llama-\u003caccel>) the cleanup example runs against."}],"connects":[{"to":"model-servers","why":"Uses its port check, job-object tie and /health readiness probe to start llama-server."},{"to":"pipeline","why":"Receives each raw transcript with a style; returns cleaned text, or the raw text unchanged."},{"to":"injection","why":"The style comes from inject::foreground_process, the lowercased executable name of the focused app."},{"to":"settings","why":"The cleanup setting and PARAFLOW_NO_CLEANUP decide at launch whether the cleanup server starts."},{"to":"app-shell","why":"lib.rs starts cleanup, loads the dictionary, and opens dictionary.txt from the tray and Settings."},{"to":"first-run-setup","why":"The cleanup install choice downloads the llama-server runtime and Qwen3 4B model used here."}],"rules":["README.md"],"checks":["src-tauri/examples/cleanup.rs","src-tauri/src/polish.rs","src-tauri/src/dictionary.rs"],"watchOuts":["Never remove the \u003ctranscript> fence in wrap() or the instruction example in FEW_SHOT, because on Qwen3-4B either one alone let the model write the requested code instead of transcribing it; rerun the harness after any prompt, model or style change.","Never put anything that varies per utterance in the system prompt, because it would invalidate llama.cpp's cached prefix on every request; the style goes in the final user turn and the dictionary stays in the system message.","Always keep apply() failing open and keep the finish_reason == \"length\" rejection, because a cleanup cut off at the token ceiling otherwise pastes as if complete and the user loses their last sentences.","Never drop --jinja from the llama-server launch, because without Qwen's own chat template the few-shot turns stop reading as a conversation, silently gutting them.","Always slice strings in tidy() with len_utf8, never a bare byte offset, because a curly quote is three bytes and a mis-slice panics the pipeline thread."]},{"id":"model-servers","group":"models","name":"Model servers","oneLiner":"Keeps the local AI model servers tied to the app and ready before use.","summary":"Model servers is the shared plumbing for the child processes that hold the AI models. Both the speech recogniser and the cleanup model run as separate local HTTP servers rather than inside the app, which keeps GPU work off the app's threads, keeps each model loaded, and means a crash in a server cannot take the app down. This module checks that a server's port is free, binds the server's lifetime to ParaFlow with a Windows job object (so it cannot outlive the app and strand GPU memory), and waits until the server can actually serve.","journey":["A user launches ParaFlow; before each model server starts, its port on 127.0.0.1 is tried with a 300 ms connection attempt.","If a connection succeeds, that server is not started and the error names the port and suggests another ParaFlow instance is running: without the speech server dictation does not start; without llama-server ParaFlow carries on without cleanup.","The server process is spawned without a console window, from the folder that holds its DLLs.","tie_to_parent puts it in a Windows job object that ends it when ParaFlow exits, even after a crash.","await_ready probes the server ('/' for speech, '/health' for llama-server), giving each probe 500 ms and pausing 150 ms after a miss, until any non-503 answer, the process exits, or 180 s pass.","When the owning Asr or Polish object is dropped, it kills its server and waits for it to exit."],"owns":["src-tauri/src/sidecar.rs"],"keyFiles":[{"path":"src-tauri/src/sidecar.rs","what":"ensure_port_free, tie_to_parent (Windows job object), await_ready, and the CREATE_NO_WINDOW flag."},{"path":"src-tauri/src/asr.rs","what":"Spawns the speech server with these helpers on port 8178; its Drop kills the process."},{"path":"src-tauri/src/polish.rs","what":"Spawns llama-server with these helpers on port 8179, probing /health; its Drop kills it."}],"models":[],"jobs":[],"switches":[],"connects":[{"to":"transcription","why":"Asr calls these helpers to check the port, bind lifetime and await the parakeet or whisper server."},{"to":"cleanup","why":"Polish calls these helpers to check the port, bind lifetime and await llama-server."}],"rules":["README.md"],"checks":[],"watchOuts":["Never treat an open connection as readiness, because llama-server binds its port immediately and answers 503 while weights load; await_ready accepts only a non-503 response.","Always call ensure_port_free before spawning, because Windows lets a second process bind a held port and the readiness probe would then succeed against another instance's model with no error anywhere.","Never close the job handle in tie_to_parent, because it is leaked on purpose: Windows kills the sidecars, freeing their GPU memory, only when ParaFlow's last handle closes.","Always launch a sidecar from its own folder, as asr.rs and polish.rs do, and keep its DLLs (including the CUDA libraries) beside the exe, because setup and scripts/setup.ps1 flatten each runtime's archives into that one folder so the exe can find its DLLs.","Never assume a server that dies after startup comes back, because nothing restarts it: a dead speech server fails every dictation and a dead llama-server silently pastes raw text until ParaFlow restarts."]},{"id":"first-run-setup","group":"models","name":"First-run setup","oneLiner":"Downloads the speech runtimes and models on first launch, after one simple question.","summary":"First-run setup downloads the inference programs (runtimes) and model weights that the installer deliberately leaves out. On first launch it detects the GPU (CUDA if the NVIDIA driver's nvcuda.dll loads, Vulkan otherwise), asks one question - dictation only, or dictation with cleanup - and fetches the matching files into %LOCALAPPDATA%\\ParaFlow. Downloads resume after an interruption and are checked against the size the server reports, and runtime archives are stamped only once fully extracted, so a half-unpacked runtime folder is deleted at the next launch rather than trusted, while a half-downloaded file is kept and resumed. Developers working from the repo use scripts/setup.ps1 instead, which fills vendor/ and models/.","journey":["At launch ParaFlow deletes any runtime folder whose archives were not all stamped as fully extracted.","It looks for the Parakeet server and model with the same path lookup dictation uses; if either is missing, or PARAFLOW_FORCE_SETUP is set, the HUD window grows into the setup screen.","The screen names the detected graphics and offers dictation with cleanup (the default) or dictation only, with the size still left to download.","The user clicks Install; a background thread fetches each asset in order into %LOCALAPPDATA%\\ParaFlow, skipping ones already there.","Each download writes to a .part file, resumes with a Range header after an interruption, and reports progress about every 4 MB.","Models move into models/; runtime zips are flattened into runtimes/\u003cfolder> and stamped under .installed.","When all land, the window shrinks back to the overlay, the user guide opens once, and dictation starts; a failure shows its message on the setup screen.","On later launches setup appears only if the Parakeet server or model is missing, so finishing a failed cleanup download, or adding cleanup after choosing dictation only, needs PARAFLOW_FORCE_SETUP; until then dictation runs without cleanup."],"owns":["src-tauri/src/setup.rs","src/Setup.tsx","scripts/setup.ps1"],"keyFiles":[{"path":"src-tauri/src/setup.rs","what":"GPU detection, the asset plan per profile, resumable download, flat unzip, install stamps and the incomplete-install purge."},{"path":"src/Setup.tsx","what":"The setup screen: hardware note, the one install choice with sizes, and download progress."},{"path":"src-tauri/src/lib.rs","what":"Runs purge and readiness at launch, exposes setup_status and begin_setup, starts the pipeline after setup."},{"path":"src/App.tsx","what":"Asks setup_status on load and shows the Setup screen instead of the overlay until setup-done."},{"path":"scripts/setup.ps1","what":"Developer script that fills the repo's vendor/ and models/ with CUDA runtimes and weights."}],"models":[],"jobs":[{"name":"Developer runtime and model fetch","kind":"file","ref":"scripts/setup.ps1","when":"on demand, once per developer checkout","what":"Downloads CUDA runtimes, the whisper fallback and model weights into the repo's vendor/ and models/."}],"switches":[{"name":"PARAFLOW_FORCE_SETUP","what":"Shows the setup screen even when everything is installed; deletes nothing, and assets already present are skipped."},{"name":"LOCALAPPDATA","what":"Windows per-user data folder; its ParaFlow subfolder is the install root. Without it, setup cannot install."},{"name":"NoCleanup","what":"scripts/setup.ps1 flag that skips the llama.cpp runtime and the cleanup model."},{"name":"SmallOnly","what":"scripts/setup.ps1 flag that skips the large whisper model, keeping only base.en."},{"name":"ParakeetTag","what":"scripts/setup.ps1 parameter choosing the parakeet.cpp release; setup.rs hard-codes its own download URLs, so a version bump must change both files."},{"name":"LlamaTag","what":"scripts/setup.ps1 parameter choosing the llama.cpp release; setup.rs hard-codes its own download URLs, so a version bump must change both files."},{"name":"WhisperTag","what":"scripts/setup.ps1 parameter choosing the whisper.cpp release that supplies the whisper fallback binaries."}],"connects":[{"to":"app-shell","why":"lib.rs runs purge_incomplete and ready() at launch, hosts the setup commands, and starts the pipeline afterwards."},{"to":"hud","why":"App.tsx shows Setup.tsx inside the HUD window, which lib.rs resizes and makes clickable for setup."},{"to":"transcription","why":"Downloads the Parakeet runtime and model the recogniser loads; ready() checks the same paths."},{"to":"cleanup","why":"The cleanup profile downloads the llama-server runtime and the Qwen3 4B cleanup model."},{"to":"settings","why":"settings.rs stores settings.json under setup's install_root(), %LOCALAPPDATA%\\ParaFlow."}],"rules":["README.md"],"checks":["src-tauri/src/setup.rs"],"watchOuts":["Never decide an archive is installed by checking its folder, because CUDA runtimes need two archives in one folder; a directory check once skipped the cuBLAS archive and the server later died with 'cublas64_12.dll was not found'.","Always answer 'is setup needed?' with the same repo-style lookup the pipeline uses (ESSENTIAL_SERVERS, ESSENTIAL_MODEL), because a check of the install root alone would show setup to a developer who already has vendor/.","Always keep plan()'s file names and runtime folder names in step with asr.rs, lib.rs and ESSENTIAL_*, because the app finds downloads by those exact names, with vendor/ mapped to runtimes/.","Never append to a .part file when the server answers 200 instead of 206, because it ignored the Range header and sent the whole file; fetch() starts over instead.","Always keep purge_incomplete limited to runtimes/, because the multi-gigabyte models live in models/ and are proven by their file name alone."]},{"id":"app-shell","group":"app","name":"App shell","oneLiner":"Starts the app: tray menu, windows, first-run check, and the dictation threads.","summary":"The app shell is the Rust entry point that starts everything. main.rs calls lib.rs, which declares the backend modules, registers the eight commands the windows can invoke (call into Rust), builds the system-tray menu, and decides whether to show first-run setup or start dictating. It owns the window plumbing: the HUD overlay, made click-through and placed bottom, top or centre, and a separate Settings window created on demand. It also owns resolve(), which looks for runtimes and models in %LOCALAPPDATA%\\ParaFlow first and the repo's vendor/ and models/ second.","journey":["A user launches ParaFlow; a release build runs with no console window.","The shell loads settings.json, builds the tray icon and menu, and deletes any runtime folder an interrupted install left half-extracted.","If the Parakeet speech server or its model is missing (or PARAFLOW_FORCE_SETUP is set), the HUD window grows into a focusable 620x520 setup screen.","Otherwise the HUD is made click-through, placed per the overlay setting, and told the app is starting.","A pipeline thread starts the transcription server, the optional cleanup server and the keyboard-hook thread, then runs the dictation loop.","The tray menu opens Settings, moves or shows the overlay, opens the dictionary, data folder or user guide, or quits.","If startup fails, a fatal event puts the error on the overlay instead of leaving it on Starting."],"owns":["src-tauri/src/lib.rs","src-tauri/src/main.rs","src-tauri/build.rs","src-tauri/capabilities/**","src-tauri/tauri.conf.json"],"keyFiles":[{"path":"src-tauri/src/main.rs","what":"Entry point; hides the console in release builds and calls paraflow_lib::run."},{"path":"src-tauri/src/lib.rs","what":"Declares modules, registers commands, builds the tray, places windows, starts setup or the pipeline thread."},{"path":"src-tauri/tauri.conf.json","what":"Defines the HUD window: transparent, undecorated, always on top, created unfocused and off the taskbar; plus the content security policy."},{"path":"src-tauri/capabilities/default.json","what":"Tauri permissions granted to the hud and settings windows: events, show/hide, size, position, opener."},{"path":"src-tauri/build.rs","what":"Runs tauri_build at compile time, which writes the gen/schemas permission files that capabilities/default.json references."}],"models":[],"jobs":[],"switches":[{"name":"PARAFLOW_LOG","what":"Chooses which backend log messages are printed to standard output (a filter of module names and levels); a release build opens no console for them."},{"name":"PARAFLOW_MODEL","what":"Overrides which transcription model file in models/ is loaded."},{"name":"PARAFLOW_CLEANUP_MODEL","what":"Overrides which cleanup model file in models/ the cleanup server loads."},{"name":"debug_assertions","what":"Debug builds keep a console window for log output; release builds open none and run as a tray app."}],"connects":[{"to":"pipeline","why":"Spawns the pipeline thread and hands it the mic session, transcriber, optional cleanup and hotkey channel."},{"to":"hotkey","why":"Starts the keyboard-hook thread with the saved chord; relays chord-capture events to the Settings window."},{"to":"first-run-setup","why":"Checks readiness at launch, purges partial installs, runs begin_setup, and finds the install root."},{"to":"transcription","why":"Locates and starts the transcription server, honouring PARAFLOW_MODEL, before dictation begins."},{"to":"cleanup","why":"Starts the cleanup server with the personal dictionary, or carries on with raw transcripts when it cannot."},{"to":"settings","why":"Loads settings first at launch, hosts get_settings and save_settings, and saves tray overlay choices."}],"rules":["README.md"],"checks":[],"watchOuts":["Never let the HUD take focus or catch clicks, because a focused overlay receives its own paste; CSS pointer-events alone does not stop Windows routing clicks, so set_ignore_cursor_events is required.","Always start the pipeline through spawn_pipeline, because its PIPELINE_STARTED guard stops a repeated setup completion from launching two sets of GPU model servers.","Always open the microphone on the paraflow-pipeline thread, because cpal's audio stream cannot move between threads on Windows.","Never hardcode the push-to-talk chord in user-facing text, because a rebind then looks broken; the HUD reads it live, but the tray tooltip still says Ctrl+Win.","Always add a new window's label to capabilities/default.json, because Tauri grants front-end permissions (events, window sizing) per window label."]},{"id":"hud","group":"app","name":"HUD overlay","oneLiner":"Always-on-top overlay showing dictation stage, audio level and whether the mic is live.","summary":"The HUD (heads-up display) is the small transparent overlay that shows what ParaFlow is doing. It is a React page that listens to events from the Rust pipeline (stage, microphone state, audio level) and draws a pill with a status line, a level meter and a LIVE/OFF microphone badge. It never takes focus and lets clicks through, so it can never catch the paste. One front-end bundle serves every window: main.tsx renders the Settings form for ?view=settings and the overlay otherwise, and the overlay swaps in the setup screen on first run.","journey":["On launch the overlay says Starting while models load; the key does nothing yet.","It asks the backend whether setup is needed and shows the setup screen in its place if so.","Once ready it shows Ready with the live chord, or draws nothing when auto-hide is on and the mic is closed.","A user holds the hotkey: Opening mic on a session's first press, then Listening with a 13-bar level meter updated every 50 ms.","After a double-tap it shows Hands-free with a clock, counting down for the last 20 seconds.","On release it shows Transcribing, Cleaning up when cleanup runs, then the pasted text and the time since recording began, for 2.6 seconds.","Errors show for 5 seconds; a fatal startup error stays. The LIVE/OFF badge mirrors the mic throughout."],"owns":["src/App.tsx","src/main.tsx","src/styles.css","src/useFitWindow.ts","index.html"],"keyFiles":[{"path":"src/main.tsx","what":"Front-end entry: renders the overlay, or the Settings form when the URL has ?view=settings."},{"path":"src/App.tsx","what":"The overlay: subscribes to pipeline events and renders stage, level meter and LIVE badge, or setup."},{"path":"src/styles.css","what":"Shared stylesheet: HUD pill and animations, plus the setup screen and settings form."},{"path":"index.html","what":"Page shell every window loads; mounts main.tsx."},{"path":"src/useFitWindow.ts","what":"Hook that grows the setup and settings windows to fit their content, capped by the monitor."},{"path":"src-tauri/src/pipeline.rs","what":"Defines the Stage, MicEvent and level events the overlay renders."}],"models":[],"jobs":[],"switches":[{"name":"autoHide","what":"When on, the overlay draws nothing while idle with the mic closed; it always shows while the mic is open."},{"name":"view","what":"URL query value that makes the shared bundle render the Settings form instead of the overlay."}],"connects":[{"to":"pipeline","why":"Receives stage, microphone open/closed and audio-level events that drive every overlay state."},{"to":"app-shell","why":"The shell creates, places and makes the overlay click-through, and sends it fatal startup errors."},{"to":"first-run-setup","why":"Renders the setup screen in the same window when setup_status says setup is needed."},{"to":"settings","why":"Reads the chord and auto-hide setting, and refreshes them on the settings-changed event."}],"rules":["README.md"],"checks":["build"],"watchOuts":["Never let auto-hide blank the overlay while the microphone is open, because the LIVE badge is the app's honesty signal; only the user's explicit Hidden setting removes it.","Always default the stage to starting, because an event emitted before the webview subscribes is simply lost.","Always change App.tsx's Stage and Mic types together with pipeline.rs, because nothing type-checks the event payloads across Rust and TypeScript.","Never reuse a class name across the HUD, setup and settings styles, because they share styles.css; a shared .bar once overrode the waveform gradient.","Never clear a fatal error on a timer, because a failed start means the pipeline is not coming back."]},{"id":"settings","group":"app","name":"Settings","oneLiner":"Saves user preferences and the screen to change hotkey, overlay, mic timeout and cleanup.","summary":"Settings is the user's saved configuration plus the Settings.tsx form, opened from the tray in its own focusable window, that edits it. settings.rs keeps one shared live copy, loads %LOCALAPPDATA%\\ParaFlow\\settings.json at startup (missing fields take their defaults; a file that will not parse falls back to defaults entirely) and saves it atomically. Most values are read at each use, so they apply without a restart; the hotkey and hands-free latch are pushed into the keyboard hook, and turning cleanup on or off needs a restart. Three environment variables, PARAFLOW_IDLE_SECS, PARAFLOW_NO_CLEANUP and PARAFLOW_NO_LATCH, override the saved values.","journey":["A user picks Tray, then Settings; a separate focusable window opens at index.html?view=settings.","The form loads the live settings through get_settings.","To rebind, they click Change and hold a combination; the largest set of keys held at once becomes the chord.","They adjust overlay position, auto-hide, mic idle timeout, chimes, hands-free and cleanup.","Save writes settings.json through a temporary file and replaces the live copy.","The new chord and latch go into the keyboard hook, the overlay moves and re-reads the chord; timeout and chimes apply on next use.","Changing cleanup shows a notice asking for a restart."],"owns":["src-tauri/src/settings.rs","src/Settings.tsx"],"keyFiles":[{"path":"src-tauri/src/settings.rs","what":"Settings struct and defaults, load/atomic save of settings.json, environment overrides, unit tests."},{"path":"src/Settings.tsx","what":"The settings form: in-window chord capture, toggles, and Save through save_settings."},{"path":"src-tauri/src/lib.rs","what":"Commands get_settings, save_settings and hotkey capture; opens the settings window; applies overlay changes."},{"path":"src/useFitWindow.ts","what":"Sizes the settings window to its content, scrolling only when the screen is too small."}],"models":[],"jobs":[],"switches":[{"name":"hotkey","what":"settings.json key: the push-to-talk chord as key names; unusable names fall back to the default."},{"name":"overlay","what":"settings.json key: where the overlay sits (bottom, top, centre) or hides it."},{"name":"idleSeconds","what":"settings.json key: quiet time before the microphone closes, clamped to 5-3600 seconds when used."},{"name":"cleanup","what":"settings.json key: turns the cleanup pass on or off; takes effect after a restart."},{"name":"chimes","what":"settings.json key: turns the mic open and close chimes on or off."},{"name":"handsFree","what":"settings.json key: turns double-tap hands-free recording on or off."},{"name":"autoHide","what":"settings.json key: hides the overlay while idle with the mic closed."},{"name":"PARAFLOW_IDLE_SECS","what":"Overrides the saved mic idle timeout."},{"name":"PARAFLOW_NO_CLEANUP","what":"When set, turns cleanup off regardless of settings.json."},{"name":"PARAFLOW_NO_LATCH","what":"When set, turns hands-free latching off regardless of settings.json."}],"connects":[{"to":"app-shell","why":"lib.rs hosts the settings commands and window, and applies overlay changes at once."},{"to":"hotkey","why":"Chord names are parsed into a Chord; new chord and latch setting are pushed into the hook."},{"to":"pipeline","why":"The pipeline re-reads the idle timeout every half-second check and after each utterance; hands-free lives in the hook."},{"to":"audio","why":"Chimes play only while the chimes setting is on, read at each mic open and close."},{"to":"first-run-setup","why":"settings.json lives in the install root, %LOCALAPPDATA%\\ParaFlow, which setup owns."},{"to":"hud","why":"The overlay re-reads the chord and auto-hide when settings-changed fires after a save."}],"rules":["README.md"],"checks":["src-tauri/src/settings.rs","build"],"watchOuts":["Always push hotkey and hands-free changes into the hook (save_settings does), because the hook keeps its own copy and never reads settings on the keystroke path.","Never write settings.json in place, because a write cut off mid-way would reset every setting to defaults; save() writes a .tmp file and renames it.","Always give a new field a default, because the struct is #[serde(default)] so older or hand-edited partial files still load; tests pin this.","Always cancel hotkey capture when the form closes or finishes, because an armed capture swallows every keystroke system-wide; the form reads keys itself, since the hook sees none while its window has focus.","Always check PARAFLOW_IDLE_SECS, PARAFLOW_NO_CLEANUP and PARAFLOW_NO_LATCH when a setting seems ignored, because they override settings.json and the form does not show them."]},{"id":"build-release","group":"ship","name":"Build and installer","oneLiner":"Builds the app and a small Windows installer that leaves models for first run.","summary":"Build and installer covers the toolchain that turns the repo into a Windows installer, built locally since the repo has no CI. npm scripts drive Vite (the front-end dev server and bundler) and the Tauri CLI; Cargo builds the Rust backend with an optimized release profile. tauri build makes an NSIS installer that ships the app, icons and the user guide only; runtimes and models download on first run. The NSIS hooks add a user-guide Start-menu shortcut and make 'delete application data' really remove the data folder, after asking.","journey":["A developer runs npm install and scripts/setup.ps1 (runtimes and models), then npm run tauri dev; Vite serves the UI on port 1420 and Cargo builds the Rust side.","npm run tauri build runs npm run build (tsc, then vite build into dist/) and compiles the release binary with the UI embedded.","Tauri wraps the binary, icons and user guide into an NSIS installer under src-tauri/target/release/bundle/nsis/.","A user runs the unsigned installer; it installs per machine into Program Files after one elevation prompt.","The install hook adds a ParaFlow User Guide shortcut beside ParaFlow's own in the Start menu.","On uninstall the hook removes that shortcut and, only if the user ticked delete data and confirms, deletes %LOCALAPPDATA%\\ParaFlow."],"owns":["package.json","package-lock.json","vite.config.ts","tsconfig*.json","src-tauri/Cargo.*","src-tauri/tauri.conf.json","src-tauri/nsis/**","src-tauri/icons/**","app-icon.png",".gitignore",".gitattributes","LICENSE",".github/workflows/*.yml"],"keyFiles":[{"path":"package.json","what":"npm scripts (dev, build, preview, tauri) and front-end dependencies."},{"path":"src-tauri/tauri.conf.json","what":"Build commands, dev URL, NSIS target, per-machine install, hooks file, bundled user guide."},{"path":"src-tauri/nsis/hooks.nsh","what":"Install/uninstall hooks: user-guide Start-menu shortcut and the confirmed data-folder delete."},{"path":"src-tauri/Cargo.toml","what":"Rust dependencies, custom-protocol feature, release profile: whole-program optimisation (LTO), stripped symbols, abort on panic."},{"path":"vite.config.ts","what":"Vite on fixed port 1420 with strictPort; ignores src-tauri, models and vendor when watching."},{"path":"tsconfig.json","what":"Strict TypeScript settings for src/, checked by npm run build."},{"path":".gitignore","what":"Keeps vendor/, models/, build output, generated schemas and NEXT.md out of git."},{"path":".gitattributes","what":"LF in the repo; CRLF for .ps1 and .nsh; binary for images, weights and executables."},{"path":"app-icon.png","what":"Source image for the icons in src-tauri/icons, regenerated with npx tauri icon."}],"models":[],"jobs":[{"name":"Vite dev server","kind":"package-script","ref":"dev","when":"on demand; tauri dev runs it first","what":"Serves the React UI on port 1420 with hot reload, failing rather than moving port."},{"name":"Front-end build","kind":"package-script","ref":"build","when":"on demand; tauri build runs it first","what":"Type-checks src/ with tsc, then bundles the UI into dist/ for embedding."},{"name":"Preview built UI","kind":"package-script","ref":"preview","when":"on demand","what":"Serves the built dist/ folder locally with Vite."},{"name":"Tauri CLI","kind":"package-script","ref":"tauri","when":"on demand","what":"npm run tauri dev runs the app for development; npm run tauri build makes the NSIS installer."},{"name":"Field Guide check","kind":"github-action","ref":".github/workflows/field-guide.yml","when":"every push and pull request","what":"Fails when a file is off the map or a name the guide uses is gone."}],"switches":[{"name":"custom-protocol","what":"Cargo feature that embeds the built UI in the binary instead of loading the Vite dev server; tauri build turns it on."},{"name":"installMode","what":"NSIS install mode; per-machine keeps the program in Program Files, apart from the data folder."},{"name":"$DeleteAppDataCheckboxState","what":"The uninstaller's delete-application-data tick; when set, the hook asks before deleting the data folder."},{"name":"$NoShortcutMode","what":"The installer's /NS switch; when set, the hook adds no user-guide shortcut."},{"name":"$UpdateMode","what":"Set during an in-place upgrade; the install hook then adds no shortcut and data is never deleted, though the uninstall hook still removes the shortcut."}],"connects":[{"to":"docs","why":"Bundles docs/user-guide.html beside the executable and adds its Start-menu shortcut."},{"to":"hud","why":"tsc and Vite build the React front end into dist/, embedded in the release binary."},{"to":"app-shell","why":"tauri.conf.json defines the HUD window and CSP the shell runs with."},{"to":"first-run-setup","why":"The installer ships no models; setup downloads them into the data folder the uninstaller may delete."}],"rules":["README.md"],"checks":[],"watchOuts":["Never switch installMode to currentUser, because Tauri would then install into %LOCALAPPDATA%\\ParaFlow, among the models, settings and dictionary.","Never bundle vendor/ or models/, because model weights barely compress and bundling copied gigabytes into target/debug on every dev run.","Always build releases with tauri build or cargo --features custom-protocol, because otherwise the window loads a dev server at localhost:1420 that is not there; keep Vite's strictPort, because a silently moved port leaves the dev window blank.","Always keep the data delete in hooks.nsh, because Tauri's own checkbox targets %LOCALAPPDATA%\\com.paraflow.dictation, which never exists; keep its default-No prompt, because the delete is irreversible.","Always bump the version in package.json, package-lock.json, src-tauri/Cargo.toml, src-tauri/tauri.conf.json and the user-guide footer together, because nothing keeps them in sync."]},{"id":"docs","group":"ship","name":"Docs","oneLiner":"README for developers, an offline HTML guide for users, and this field guide.","summary":"Docs are the project's hand-written references plus this guide. README.md is the developer guide: install, building the installer, settings, environment variables, architecture and measured latency. docs/user-guide.html is the end-user guide, a single self-contained HTML file with no external assets, so it works offline and opens as a formatted page on Windows. The installer bundles it beside the executable; docs/field-guide/ holds this Field Guide and its vendored command-line tool.","journey":["A newcomer opens README.md for install, build, configuration and architecture notes.","An end user reads the user guide: getting started, the overlay, the mic, hands-free, cleanup, settings, troubleshooting, privacy and uninstalling.","The installer places the guide beside the executable as ParaFlow User Guide.html.","It opens once automatically when first-run setup finishes, and from the tray, Settings Help, and the Start menu.","A contributor who changes a system re-reads its guide entry and runs the guide check, which proves names exist but not that the prose is true."],"owns":["README.md","docs/**",".claude/skills/**"],"keyFiles":[{"path":"README.md","what":"Developer guide: install, build, settings, environment variables, architecture, measured latency."},{"path":"docs/user-guide.html","what":"Self-contained offline end-user guide, bundled beside the installed executable."},{"path":"docs/field-guide/README.md","what":"How to read, check and update this Field Guide."},{"path":"docs/field-guide/guide.json","what":"The guide itself, its source of truth; read it through guide.mjs lookups rather than opening it whole."},{"path":"docs/field-guide/guide.mjs","what":"Vendored guide command-line tool: lookup, check, render; never edited by hand."},{"path":".claude/skills/field-guide/SKILL.md","what":"Tells Claude sessions to read one guide entry before opening a system's code."}],"models":[],"jobs":[{"name":"Guide check","kind":"file","ref":"docs/field-guide/guide.mjs","when":"on demand, after changing a system","what":"Checks every file is owned and every named file, job and switch exists; render writes guide.html."}],"switches":[],"connects":[{"to":"build-release","why":"tauri.conf.json bundles the user guide; hooks.nsh links it from the Start menu."},{"to":"app-shell","why":"Tray, Settings Help and post-setup open the guide through guide_path, falling back to the repo copy."}],"rules":["README.md","docs/field-guide/README.md"],"checks":[],"watchOuts":["Always keep user-guide.html one file with no external assets, because it must work offline and ships as a single bundled resource.","Never rename or move the guide without updating tauri.conf.json bundle.resources, lib.rs (GUIDE_FILE and the repo fallback) and hooks.nsh, because each way in hardcodes its path or installed name.","Always update the guide and README when behaviour changes, because they restate code numbers by hand (30 s idle, 5-3600 s, two-minute latch, 0.25 s minimum press).","Always keep new guide sections inside \u003cmain>, because the page grid puts anything after it in the narrow left column; Credits already sits there.","Never edit docs/field-guide/guide.mjs, because it is a vendored copy of the guide tool; replace it with a newer release."]}],"flows":[{"name":"Dictating a sentence","steps":[{"system":"hotkey","text":"The user holds the chord; the keyboard hook sends a press event."},{"system":"pipeline","text":"The pipeline starts an utterance and opens the mic if the session was closed."},{"system":"audio","text":"The mic records into a ring buffer; a session's first press starts after the chime, later presses reach back 300 ms for pre-roll."},{"system":"hud","text":"The overlay shows Listening and the audio level."},{"system":"transcription","text":"On release, the audio goes to the local speech-model server and comes back as raw text."},{"system":"cleanup","text":"The cleanup model fixes punctuation and fillers in the focused app's style, or the raw text is kept."},{"system":"injection","text":"The text is pasted through the clipboard, and the old clipboard text is put back unless something new was copied meanwhile."}]},{"name":"First launch","steps":[{"system":"build-release","text":"The small installer puts the app on disk without runtimes or models."},{"system":"app-shell","text":"At startup the app finds the speech server or model missing."},{"system":"first-run-setup","text":"The setup screen asks one question and downloads the runtimes and weights."},{"system":"app-shell","text":"When the downloads finish, the window shrinks back to the overlay and the user guide opens once."},{"system":"model-servers","text":"The model servers start, tied to the app, and are probed until ready."},{"system":"pipeline","text":"Dictation starts and the overlay switches from Starting to Ready."}]},{"name":"Changing a setting","steps":[{"system":"app-shell","text":"The tray menu opens the Settings window."},{"system":"settings","text":"The form saves settings.json atomically and replaces the live copy."},{"system":"hotkey","text":"A new chord or hands-free setting is pushed into the keyboard hook."},{"system":"hud","text":"The overlay is moved at once and re-reads the chord and auto-hide setting."},{"system":"pipeline","text":"The idle timeout is re-read at the next check, so it applies without a restart."}]}],"glossary":[{"term":"Chord","meaning":"The set of keys that must all be held at once to dictate; Ctrl + Win by default, stored by key name in settings.json."},{"term":"WH_KEYBOARD_LL","meaning":"A Windows low-level keyboard hook: a callback that sees every keystroke system-wide, used here to catch both press and release."},{"term":"Hands-free latch","meaning":"Double-tap the chord to keep recording without holding keys; a single press of the chord stops it, and it stops itself after 120 seconds."},{"term":"Double-press window","meaning":"How soon a second press must follow a release to count as a double-tap: Windows' double-click time, clamped to 200-600 ms."},{"term":"Capture mode","meaning":"Hook state used while rebinding: every keystroke it sees is swallowed, and the largest set held at once is offered as the new chord."},{"term":"Ring buffer","meaning":"A fixed-size store of the last 150 seconds of microphone audio that overwrites its oldest samples; a recording is a position in it."},{"term":"Pre-roll","meaning":"The 300 ms of audio before a press that is kept, so a syllable spoken slightly ahead of the key is not lost."},{"term":"Resampling","meaning":"Converting the microphone's native sample rate, usually 44.1 or 48 kHz, to the 16 kHz the speech models expect."},{"term":"cpal","meaning":"The Rust audio library ParaFlow uses to open the default input device and receive captured samples."},{"term":"Session","meaning":"A burst of dictation: the microphone opens on its first press and closes after the idle timeout passes with no presses."},{"term":"Utterance","meaning":"One press-and-hold, or one hands-free recording, inside a session; it becomes one paste."},{"term":"Stage","meaning":"The pipeline's current step (Starting, Idle, Waking, Listening, Latched, Transcribing, Polishing, Done, Error), sent to the overlay as flow://stage."},{"term":"Noise floor","meaning":"A peak level (0.003 on a 0-1 scale) below which a recording is treated as silence and discarded."},{"term":"SendInput","meaning":"The Windows function that injects synthetic keystrokes; used to send Ctrl+V and to release modifier keys still held."},{"term":"Injected keystroke","meaning":"A key event created by software rather than the keyboard; Windows flags it, so the hook can ignore ParaFlow's own paste."},{"term":"Sidecar","meaning":"A separate server process ParaFlow starts on 127.0.0.1 and talks to over HTTP; each keeps one model loaded in GPU memory."},{"term":"Parakeet","meaning":"NVIDIA's Parakeet TDT 0.6B speech-recognition model, run by parakeet.cpp; the default transcription backend, which adds punctuation and capitals itself."},{"term":"whisper.cpp","meaning":"C++ runtime for OpenAI's Whisper speech model; the opt-in fallback transcription backend. It can bias decoding toward supplied words, which ParaFlow does not use."},{"term":"GGUF","meaning":"A single-file format for quantised (reduced-precision) model weights, used by llama.cpp and parakeet.cpp."},{"term":"llama-server","meaning":"llama.cpp's HTTP server with an OpenAI-style chat endpoint; it runs the Qwen3 4B cleanup model."},{"term":"Few-shot examples","meaning":"Worked input-and-output pairs sent before the real request, showing the model what cleaning up a transcript means."},{"term":"Prompt cache","meaning":"llama.cpp reuses its work on the unchanging start of a prompt, so each request only processes the new transcript."},{"term":"Vocabulary drift","meaning":"A cleanup guard: if the output reuses under half the spoken words, it is treated as an answer and the raw transcript is kept."},{"term":"Fail open","meaning":"On any failure, pass the input through unchanged instead of erroring; cleanup always falls back to the raw transcript."},{"term":"Job object","meaning":"A Windows grouping of processes; with kill-on-close set, Windows ends the model servers when ParaFlow exits, even after a crash."},{"term":"Readiness probe","meaning":"Repeated HTTP requests to a starting server until it answers with anything but 503, meaning its model has loaded."},{"term":"CUDA / Vulkan","meaning":"Two ways to run work on the GPU: CUDA is NVIDIA-only and much faster for cleanup; Vulkan also runs on AMD and Intel."},{"term":"Profile","meaning":"Setup's one choice: Transcribe (speech runtime and model only) or Polish (adds the cleanup runtime and model)."},{"term":"Install stamp","meaning":"A file under %LOCALAPPDATA%\\ParaFlow\\.installed written once an archive is fully extracted; runtime folders missing a stamp are deleted at launch."},{"term":"Tauri","meaning":"Framework pairing a Rust backend with a web front end in a native window; ParaFlow uses version 2."},{"term":"Tauri command","meaning":"A Rust function the front end calls with invoke(); Rust talks back by emitting named events the windows listen for."},{"term":"Capability","meaning":"Tauri JSON file granting named windows permission to use specific front
